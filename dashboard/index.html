<!doctype html lang="en">
<head>
  <meta charset="utf-8">
  <title>Project Dashboard // philc.io</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
    integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1clHTMGa3JDZwrnQq4sF86dIHNDz0W1"
    crossorigin="anonymous">
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.7.2/css/all.css"
    integrity="sha384-fnmOCqbTlWIlj8LyTjo7mOUStjsKC4pOpQbqyi7RrhN7udi9RwhKkMHpvLbHG9Sr"
    crossorigin="anonymous">

  <!-- Dark engineer theme styles -->
  <style>
    /* Theme variables */
    :root {
      --bg-primary:       #0d1117;
      --bg-secondary:     #161b22;
      --bg-tertiary:      #21262d;
      --border-color:     #30363d;
      --text-primary:     #e6edf3;
      --text-secondary:   #8b949e;
      --accent-blue:      #58a6ff;
      --mono:             'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, Courier, monospace;
    }

    * { box-sizing: border-box; }

    body {
      background: var(--bg-primary);
      color: var(--text-secondary);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      margin: 0;
      padding-bottom: 4rem;
    }

    /* Navbar */
    .navbar {
      background: rgba(22, 27, 34, .95) !important;
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      padding: .75rem 0;
    }
    .navbar-brand {
      color: var(--text-primary) !important;
      font-family: var(--mono);
      font-size: 1rem;
      letter-spacing: -.02em;
      font-weight: 700;
    }
    .navbar-brand:hover { color: var(--accent-blue) !important; }
    .nav-link {
      color: var(--text-secondary) !important;
      font-weight: 500;
      font-family: var(--mono);
      font-size: .85rem;
    }
    .nav-link:hover { color: var(--text-primary) !important; }

    /* Header */
    .dashboard-header {
      padding: 3rem 0 1rem;
    }
    .dashboard-header h1 {
      font-family: var(--mono);
      font-weight: 700;
      color: var(--text-primary);
      font-size: 1.75rem;
      letter-spacing: -.02em;
    }
    .dashboard-header .subtitle {
      font-family: var(--mono);
      font-size: .85rem;
      color: var(--text-secondary);
    }
    .refresh-time {
      font-family: var(--mono);
      font-size: .75rem;
      color: var(--text-secondary);
      opacity: .6;
    }

    /* Section headings */
    .section-title {
      font-family: var(--mono);
      font-size: .9rem;
      font-weight: 600;
      color: var(--text-primary);
      margin-top: 2.5rem;
      margin-bottom: 1rem;
      padding-bottom: .5rem;
      border-bottom: 1px solid var(--border-color);
    }

    /* Stats row */
    .stat-badge {
      display: inline-block;
      font-family: var(--mono);
      font-size: .75rem;
      padding: .25rem .65rem;
      border-radius: 4px;
      border: 1px solid var(--border-color);
      background: var(--bg-secondary);
      color: var(--text-secondary);
      margin-right: .5rem;
      margin-bottom: .5rem;
    }
    .stat-badge.active {
      border-color: #238636;
      color: #3fb950;
      background: rgba(63, 185, 80, .1);
    }
    .stat-badge.paused {
      border-color: #9e6a03;
      color: #d29922;
      background: rgba(210, 153, 34, .1);
    }
    .stat-badge.new {
      border-color: #1f6feb;
      color: var(--accent-blue);
      background: rgba(88, 166, 255, .1);
    }

    /* Project card */
    .project-card {
      background: var(--bg-secondary) !important;
      border: 1px solid var(--border-color) !important;
      border-radius: 8px !important;
      box-shadow: none !important;
      transition: border-color .25s, box-shadow .25s, transform .25s;
      height: 100%;
      overflow: hidden;
    }
    .project-card:hover {
      border-color: var(--accent-blue);
      box-shadow: 0 4px 16px rgba(0,0,0,.3);
      transform: translateY(-2px);
    }
    .project-card .card-body {
      padding: 1.25rem !important;
    }
    .project-name {
      font-family: var(--mono);
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: .15rem;
      display: flex;
      align-items: center;
      gap: .5rem;
    }
    .project-name a {
      color: inherit;
      text-decoration: none;
    }
    .project-name a:hover {
      color: var(--accent-blue);
    }
    .project-meta {
      font-family: var(--mono);
      font-size: .75rem;
      color: var(--text-secondary);
      opacity: .7;
      margin-bottom: .75rem;
    }
    .project-status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: .5rem;
    }
    .status-pill {
      font-family: var(--mono);
      font-size: .65rem;
      padding: .15rem .5rem;
      border-radius: 9999px;
      border: 1px solid;
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    .status-active {
      border-color: #238636;
      color: #3fb950;
      background: rgba(63, 185, 80, .08);
    }
    .status-developing {
      border-color: #1f6feb;
      color: var(--accent-blue);
      background: rgba(88, 166, 255, .08);
    }
    .status-paused {
      border-color: #9e6a03;
      color: #d29922;
      background: rgba(210, 153, 34, .08);
    }
    .status-stale {
      border-color: #484f58;
      color: var(--text-secondary);
      background: rgba(139, 148, 158, .08);
    }
    .status-new {
      border-color: #8b5cf6;
      color: #a78bfa;
      background: rgba(167, 139, 250, .08);
    }

    /* Activity bar */
    .activity-bar {
      display: flex;
      gap: 2px;
      margin: .6rem 0;
      height: 4px;
    }
    .activity-dot {
      width: 16px;
      height: 4px;
      border-radius: 2px;
      background: var(--bg-tertiary);
    }
    .activity-dot.hot { background: #f85149; }
    .activity-dot.warm { background: #d29922; }
    .activity-dot.cool { background: #3fb950; }
    .activity-dot.empty { background: var(--bg-tertiary); }

    .commit-msg {
      font-family: var(--mono);
      font-size: .8rem;
      color: var(--text-secondary);
      margin: .5rem 0;
      line-height: 1.4;
    }
    .commit-msg code {
      color: var(--accent-blue);
      background: transparent;
      padding: 0;
    }
    .commit-date {
      font-family: var(--mono);
      font-size: .7rem;
      color: var(--text-secondary);
      opacity: .6;
      margin-bottom: .5rem;
    }

    /* Tags / badges */
    .tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: .35rem;
      margin-top: .75rem;
    }
    .tag {
      font-family: var(--mono);
      font-size: .65rem;
      padding: .1rem .45rem;
      border-radius: 3px;
      background: var(--bg-tertiary);
      color: var(--text-secondary);
      border: 1px solid var(--border-color);
    }
    .tag.has-changes {
      border-color: #d29922;
      color: #d29922;
      background: rgba(210, 153, 34, .1);
    }
    .tag.has-staged {
      border-color: #1f6feb;
      color: var(--accent-blue);
      background: rgba(88, 166, 255, .1);
    }
    .tag.branches {
      border-color: #8b5cf6;
      color: #a78bfa;
      background: rgba(167, 139, 250, .1);
    }

    /* Blocker callout */
    .blocker-callout {
      background: rgba(210, 153, 34, .08);
      border: 1px solid rgba(210, 153, 34, .3);
      border-radius: 6px;
      padding: .75rem 1rem;
      margin-bottom: .75rem;
      font-size: .85rem;
    }
    .blocker-callout i { color: #d29922; margin-right: .4rem; }
    .blocker-callout strong { color: #d29922; font-family: var(--mono); }

    /* Notes area */
    .notes-area {
      background: var(--bg-tertiary);
      border: 1px dashed var(--border-color);
      border-radius: 6px;
      padding: 1rem;
      font-family: var(--mono);
      font-size: .85rem;
      color: var(--text-secondary);
      min-height: 120px;
      white-space: pre-wrap;
    }
    .notes-area:focus {
      outline: none;
      border-color: var(--accent-blue);
      border-style: solid;
    }

    /* Footer */
    .dashboard-footer {
      margin-top: 3rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border-color);
      font-family: var(--mono);
      font-size: .7rem;
      color: var(--text-secondary);
      opacity: .5;
    }
  </style>
</head>

<script>
function renderDashboard() {
  const data = DASHBOARD_DATA;
  document.getElementById('refresh-time').textContent = `Last updated: ${data.generated_at}`;

  // Render stats
  const statsContainer = document.getElementById('stats-container');
  statsContainer.innerHTML = '';
  
  const totalProjects = data.projects.length;
  const activeCount = data.projects.filter(p => p.status === 'active' || p.status === 'developing').length;
  const pausedCount = data.projects.filter(p => p.status === 'paused').length;
  const staleCount = data.projects.filter(p => p.status === 'stale').length;
  const totalBranches = data.projects.reduce((sum, p) => sum + (p.dev_branches || 0), 0);
  const changingCount = data.projects.filter(p => p.has_changes).length;
  const stagedCount = data.projects.filter(p => p.has_staged).length;

  statsContainer.innerHTML = `
    <span class="stat-badge">${totalProjects} projects tracked</span>
    <span class="stat-badge active">${activeCount} active / developing</span>
    <span class="stat-badge">${changingCount} with local changes</span>
    <span class="stat-badge ${stagedCount > 0 ? '' : ''}">${stagedCount} with staged changes</span>
    <span class="stat-badge ${pausedCount > 0 ? 'paused' : ''}">${pausedCount} paused</span>
    <span class="stat-badge">${staleCount} stale (>3mo)</span>
    <span class="stat-badge">${totalBranches} total dev branches</span>
  `;

  // Render blockers
  const blockersContainer = document.getElementById('blockers-container');
  if (data.blockers && data.blockers.length > 0) {
    blockersContainer.innerHTML = data.blockers.map(b => 
      `<div class="blocker-callout"><i class="fas fa-exclamation-triangle"></i><strong>${b.project}</strong>: ${b.note}</div>`
    ).join('');
  } else {
    blockersContainer.innerHTML = '<p style="font-size:.85rem;color:var(--text-secondary);opacity:.5;margin:0;">No active blockers logged.</p>';
  }

  // Render project cards
  const container = document.getElementById('projects-container');
  container.innerHTML = data.projects.map(project => {
    const statusClass = `status-${project.status}`;
    const statusLabel = {
      active: 'Active',
      developing: 'Developing',
      paused: 'Paused',
      stale: 'Stale',
      new: 'New'
    }[project.status] || project.status;

    // Activity bar: 5-dot scale based on recency
    const dots = [3, 2, 1, 0, 0].map(i => {
      const threshold = [2, 7, 30, 90, 365][i];
      return i <= project.days_ago_bucket ? 'hot' : 'empty';
    });

    return `
    <div class="col-md-6 col-lg-4 mb-4">
      <div class="card project-card">
        <div class="card-body">
          <div class="project-status-row">
            <div class="project-name">
              <i class="fab fa-git-alt" style="opacity:.4;font-size:.8rem;"></i>
              <a href="${project.github_url}" target="_blank" rel="noopener">${project.name}</a>
            </div>
            <span class="status-pill ${statusClass}">${statusLabel}</span>
          </div>
          
          <div class="project-meta">
            <i class="fas fa-code-branch" style="opacity:.5;"></i> ${project.branch || 'main'} 
            &nbsp;·&nbsp; ${project.size || '?'}
          </div>
          
          <div class="activity-bar">
            ${dots.map(d => `<div class="activity-dot ${d}"></div>`).join('')}
          </div>
          
          <div class="commit-msg">
            <code>${project.short_hash}</code> ${project.commit_msg_short}
          </div>
          <div class="commit-date">Updated ${project.last_commit_relative}</div>
          
          <div class="tag-row">
            ${project.dev_branches > 0 ? `<span class="tag branches">${project.dev_branches} branches</span>` : ''}
            ${project.has_staged ? `<span class="tag has-staged">⚑ staged</span>` : ''}
            ${project.has_changes ? `<span class="tag has-changes">~ unstaged</span>` : ''}
            ${(project.tags || []).map(t => `<span class="tag">${t}</span>`).join('')}
          </div>
        </div>
      </div>
    </div>`;
  }).join('');

  // Render manual notes
  document.getElementById('manual-notes').value = data.manual_notes || '<none>';
  document.getElementById('footer-info').textContent = 
    `Generated from ${data.projects.length} repos · Data source: local git state`;
}

function getDaysSince(relative) {
  if (!relative) return 999;
  const match = relative.match(/(\d+)\s*(day|week|month|hour)/);
  if (!match) return 999;
  const val = parseInt(match[1]);
  const unit = match[2];
  if (unit === 'hour') return Math.max(0, Math.floor(val / 24));
  if (unit === 'day') return val;
  if (unit === 'week') return val * 7;
  if (unit === 'month') return val * 30;
  return 999;
}

// Auto-refresh every 30 seconds (checks for file changes)
setInterval(() => {
  fetch('?_=' + Date.now())
    .then(r => r.text())
    .then(html => {
      const m = html.match(/const DASHBOARD_DATA = ({[\s\S]*?});\s*<\/script>/);
      if (m) {
        const newData = JSON.parse(m[1]);
        if (newData.generated_at !== DASHBOARD_DATA?.generated_at) {
          window.DASHBOARD_DATA = newData;
          renderDashboard();
        }
      }
    })
    .catch(() => {});
}, 30000);
